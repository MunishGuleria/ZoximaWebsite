# Deploys the site to the existing Vercel project (zoxima-website, Arsh's
# projects) on every push to main, or by hand from the Actions tab.
#
# Vercel builds it with the project's own settings and Environment Variables,
# so no secrets other than the token live here. The token is created in the
# Vercel account that owns the project (vercel.com/account/settings/tokens) and
# stored in this repo as the Actions secret VERCEL_TOKEN.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # From .vercel/project.json; identifiers, not secrets.
      VERCEL_ORG_ID: team_6wwgDxeZ78npOEqMkSZXmqWb
      VERCEL_PROJECT_ID: prj_9Iek9LZUgZW9Ybo5lnCkiXIlaoHi
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check the token is set
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set, so nothing was deployed. Add it under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Deploy to production
        if: steps.token.outputs.ok == 'true'
        # Uploads the source (minus .vercelignore) and Vercel builds it.
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
